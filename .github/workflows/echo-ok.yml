name: Echo OK Smoke Test

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  echo:
    runs-on: ubuntu-latest
    steps:
      - name: Echo
        run: |
          echo OK
          echo OK > echo-output.txt
      - name: Checkout
        uses: actions/checkout@v4
      - name: Record output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add echo-output.txt
          git commit -m "chore: capture echo OK output"
          git push
